<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مغامرة الطالب الذكي</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --accent: #fdcb6e;
            --danger: #ff7675;
            --success: #00b894;
            --dark: #2d3436;
            --white: #fff;
            --card: rgba(255, 255, 255, .92);
        }

        body {
            font-family: "Trebuchet MS", Arial, sans-serif;
            min-height: 100vh;
            color: var(--dark);
            overflow-x: hidden;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, .35) 0 40px, transparent 41px),
                linear-gradient(135deg, #74b9ff, #a29bfe 45%, #81ecec);
        }

        /* ================= BACKGROUND ================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -2;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, .55);
            border-radius: 100px;
            filter: blur(1px);
            animation: cloudMove linear infinite;
        }

        .cloud:nth-child(1) {
            width: 180px;
            height: 60px;
            top: 10%;
            left: -200px;
            animation-duration: 35s;
        }

        .cloud:nth-child(2) {
            width: 230px;
            height: 70px;
            top: 35%;
            left: -250px;
            animation-duration: 48s;
            animation-delay: 5s;
        }

        .cloud:nth-child(3) {
            width: 150px;
            height: 50px;
            top: 70%;
            left: -180px;
            animation-duration: 40s;
        }

        @keyframes cloudMove {
            from {
                transform: translateX(0)
            }

            to {
                transform: translateX(calc(100vw + 400px))
            }
        }

        .star-bg {
            position: absolute;
            font-size: 25px;
            animation: floatStar 5s ease-in-out infinite;
            opacity: .7;
        }

        @keyframes floatStar {

            0%,
            100% {
                transform: translateY(0) rotate(0)
            }

            50% {
                transform: translateY(-25px) rotate(180deg)
            }
        }

        /* ================= HEADER ================= */

        header {
            width: min(1200px, 94%);
            margin: 20px auto;
            background: rgba(255, 255, 255, .9);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 15px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .12);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .logo span {
            font-size: 40px;
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat {
            background: #fff;
            padding: 9px 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
            font-weight: bold;
        }

        .stat span {
            color: var(--primary);
        }

        /* ================= MAIN ================= */

        .container {
            width: min(1200px, 94%);
            margin: auto;
        }

        .hero {
            background: rgba(255, 255, 255, .9);
            border-radius: 35px;
            padding: 35px;
            display: grid;
            grid-template-columns: 1.5fr .8fr;
            gap: 30px;
            align-items: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .12);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .hero p {
            font-size: 19px;
            line-height: 1.8;
        }

        .start-btn {
            margin-top: 20px;
            border: 0;
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            padding: 15px 30px;
            border-radius: 18px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(108, 92, 231, .35);
            transition: .25s;
        }

        .start-btn:hover {
            transform: translateY(-4px) scale(1.03);
        }

        /* ================= CHARACTER ================= */

        .character-box {
            background: linear-gradient(145deg, #ffeaa7, #fab1a0);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            position: relative;
            min-height: 270px;
            overflow: hidden;
        }

        .character {
            font-size: 130px;
            animation: characterIdle 2.5s ease-in-out infinite;
            display: inline-block;
            user-select: none;
        }

        .character-name {
            font-size: 20px;
            font-weight: bold;
            background: white;
            display: inline-block;
            padding: 8px 18px;
            border-radius: 15px;
        }

        @keyframes characterIdle {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-12px)
            }
        }

        .character.correct {
            animation: characterCorrect .8s ease;
        }

        @keyframes characterCorrect {
            0% {
                transform: scale(1)
            }

            30% {
                transform: scale(1.3) rotate(-10deg)
            }

            60% {
                transform: scale(1.15) rotate(10deg)
            }

            100% {
                transform: scale(1)
            }
        }

        .character.wrong {
            animation: characterWrong .5s ease;
        }

        @keyframes characterWrong {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-12px)
            }

            75% {
                transform: translateX(12px)
            }
        }

        /* ================= PROGRESS ================= */

        .progress-section {
            margin: 25px 0;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .progress {
            width: 100%;
            height: 16px;
            background: rgba(255, 255, 255, .55);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b894, #55efc4);
            transition: .5s;
            border-radius: 20px;
        }

        .reset-progress-btn {
            margin-top: 12px;
            padding: 9px 18px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, .9);
            color: #6c5ce7;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .08);
            transition: .2s;
        }

        .reset-progress-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, .12);
        }

        .reset-progress-btn:active {
            transform: scale(.97);
        }

        /* ================= ACTIVITIES ================= */

        .section-title {
            margin: 35px 0 18px;
            color: white;
            font-size: 28px;
        }

        .activities {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .activity {
            background: rgba(255, 255, 255, .94);
            border: 0;
            border-radius: 22px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .1);
        }

        .activity:hover {
            transform: translateY(-8px) rotate(1deg);
        }

        .activity .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .activity h3 {
            color: var(--primary);
            margin-bottom: 6px;
        }

        .activity p {
            font-size: 13px;
        }

        /* ================= GAME ================= */

        .game {
            display: none;
            margin: 30px 0;
            background: rgba(255, 255, 255, .96);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .15);
        }

        .game.active {
            display: block;
            animation: gameIn .4s ease;
        }

        @keyframes gameIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .game-title {
            color: var(--primary);
            font-size: 27px;
        }

        .close-btn {
            border: 0;
            background: #ffecec;
            color: #d63031;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        /* ================= QUESTION ================= */

        .question {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            line-height: 1.7;
            margin: 20px 0 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .answers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .answer {
            border: 3px solid transparent;
            background: #f7f7ff;
            padding: 18px;
            border-radius: 18px;
            font-size: 18px;
            cursor: pointer;
            transition: .2s;
        }

        .answer:hover {
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .answer.correct {
            background: #dfffea;
            border-color: var(--success);
        }

        .answer.wrong {
            background: #ffe2e2;
            border-color: var(--danger);
        }

        /* ================= MEMORY ================= */

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: auto;
        }

        .memory-card {
            aspect-ratio: 1;
            border: 0;
            border-radius: 18px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: .4s;
        }

        .memory-card.open {
            background: white;
            color: #2d3436;
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            background: #dfffea;
            border: 3px solid #00b894;
        }

        /* ================= REACTION ================= */

        .reaction-box {
            height: 300px;
            background: #f1f2f6;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
        }

        .reaction-star {
            position: absolute;
            font-size: 50px;
            cursor: pointer;
            display: none;
            user-select: none;
        }

        /* ================= WORD ================= */

        .word-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 25px;
        }

        .word-piece {
            background: #ffeaa7;
            padding: 14px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            transition: .2s;
        }

        .word-piece:hover {
            transform: translateY(-5px);
        }

        /* ================= FEEDBACK ================= */

        .feedback {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .feedback.show {
            display: flex;
        }

        .feedback-card {
            background: white;
            border-radius: 30px;
            padding: 35px;
            text-align: center;
            width: min(450px, 90%);
            animation: pop .4s ease;
        }

        @keyframes pop {
            from {
                transform: scale(.6);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .feedback-emoji {
            font-size: 80px;
        }

        .feedback h2 {
            color: var(--primary);
            margin: 10px;
        }

        .next-btn {
            border: 0;
            background: var(--primary);
            color: white;
            padding: 13px 30px;
            border-radius: 15px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 15px;
        }

        /* ================= CONFETTI ================= */

        .confetti {
            position: fixed;
            width: 10px;
            height: 18px;
            top: -30px;
            z-index: 200;
            animation: confettiFall 1.5s linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ================= SETTINGS ================= */

        .settings {
            margin: 30px 0;
            background: rgba(255, 255, 255, .9);
            border-radius: 25px;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .setting-btn {
            border: 0;
            background: #f1f2f6;
            padding: 12px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ================= FINAL SCORE ================= */

        .final-score {
            text-align: center;
            background: linear-gradient(135deg, #ffeaa7, #fab1a0);
            border-radius: 25px;
            padding: 30px;
            margin-top: 25px;
        }

        .final-score h2 {
            color: #6c5ce7;
            margin-bottom: 15px;
        }

        .score-number {
            font-size: 50px;
            font-weight: bold;
            color: #00b894;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:900px) {
            .activities {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width:600px) {
            .hero h1 {
                font-size: 30px;
            }

            .activities {
                grid-template-columns: 1fr;
            }

            .answers {
                grid-template-columns: 1fr;
            }

            .memory-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>

        <div class="star-bg" style="top:15%;left:10%">⭐</div>
        <div class="star-bg" style="top:45%;left:85%">✨</div>
        <div class="star-bg" style="top:80%;left:15%">🌟</div>
        <div class="star-bg" style="top:25%;left:70%">💫</div>
    </div>

    <header>

        <div class="logo">
            <span>🎓</span>
            مغامرة الطالب الذكي
        </div>

        <div class="stats">
            <div class="stat">⭐ <span id="stars">0</span></div>
            <div class="stat">🔥 <span id="combo">0</span></div>
            <div class="stat">🏆 المستوى <span id="level">1</span></div>
        </div>

    </header>

    <main class="container">

        <section class="hero">

            <div>

                <h1>جاهز للمغامرة؟ 🚀</h1>

                <p>
                    اتعلم، العب، جاوب، واجمع النجوم!
                    كل مرة تدخل فيها الموقع هتقابل شخصية مختلفة
                    ومغامرات وأسئلة جديدة.
                </p>

                <button class="start-btn" onclick="startRandomChallenge()">
                    🎮 ابدأ المغامرة
                </button>

            </div>

            <div class="character-box">

                <div class="character" id="character">🧽</div>

                <br>

                <div class="character-name" id="characterName">
                    شخصيتك اليوم
                </div>

                <p id="characterMessage" style="margin-top:12px">
                    مستنيك نبدأ! 😄
                </p>

                <!-- خزانة الجوائز (الشارات) -->
                <div id="badgesList" style="margin-top: 15px; font-size: 30px; min-height: 40px;"></div>

            </div>

        </section>


        <section class="progress-section">

            <div class="progress-top">
                <span>تقدمك اليوم</span>
                <span id="progressText">0%</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <button class="reset-progress-btn" onclick="resetProgress()">
                🔄 تصفير التقدم
            </button>

        </section>


        <h2 class="section-title">
            🎯 اختار مغامرتك
        </h2>


        <section class="activities">

            <button class="activity" onclick="startGame('islamic')">
                <div class="icon">🕌</div>
                <h3>معلومات إسلامية</h3>
                <p>أسئلة بسيطة ومفيدة</p>
            </button>

            <button class="activity" onclick="startGame('arabic')">
                <div class="icon">🔤</div>
                <h3>لغة عربية</h3>
                <p>حروف وكلمات</p>
            </button>

            <button class="activity" onclick="startGame('missing')">
                <div class="icon">🧩</div>
                <h3>الحرف الناقص</h3>
                <p>أكمل الكلمة</p>
            </button>

            <button class="activity" onclick="startGame('memory')">
                <div class="icon">🧠</div>
                <h3>اختبار الذاكرة</h3>
                <p>اختبر قوة تركيزك</p>
            </button>

            <button class="activity" onclick="startGame('different')">
                <div class="icon">🔎</div>
                <h3>اكتشف المختلف</h3>
                <p>مين المختلف؟</p>
            </button>

            <button class="activity" onclick="startGame('reaction')">
                <div class="icon">⚡</div>
                <h3>سرعة التركيز</h3>
                <p>اضغط بسرعة!</p>
            </button>

            <button class="activity" onclick="startGame('word')">
                <div class="icon">📝</div>
                <h3>رتب الكلمة</h3>
                <p>رتب الحروف</p>
            </button>

            <button class="activity" onclick="startGame('scenario')">
                <div class="icon">💭</div>
                <h3>ماذا تفعل؟</h3>
                <p>مواقف تربوية</p>
            </button>

            <button class="activity" onclick="startGame('number')">
                <div class="icon">🔢</div>
                <h3>ذاكرة الأرقام</h3>
                <p>تذكر الرقم</p>
            </button>

            <button class="activity" onclick="startGame('pattern')">
                <div class="icon">🎨</div>
                <h3>أكمل النمط</h3>
                <p>فكر واختار</p>
            </button>

            <button class="activity" onclick="startGame('listen')">
                <div class="icon">🔊</div>
                <h3>اختار الكلمة</h3>
                <p>اختار الكلمة الصحيحة</p>
            </button>

            <button class="activity" onclick="startGame('mixed')">
                <div class="icon">🎁</div>
                <h3>تحدي عشوائي</h3>
                <p>مفاجأة كل مرة</p>
            </button>

        </section>


        <!-- GAME -->

        <section class="game" id="game">

            <div class="game-header">

                <div class="game-title" id="gameTitle">
                    التحدي
                </div>

                <button class="close-btn" onclick="closeGame()">
                    ×
                </button>

            </div>

            <div id="gameContent"></div>

        </section>


        <section class="settings">

            <button class="setting-btn" onclick="toggleSound()">
                🔊 الصوت: <span id="soundState">ON</span>
            </button>

            <button class="setting-btn" onclick="changeCharacter()">
                🎭 شخصية جديدة
            </button>

            <button class="setting-btn" onclick="startRandomChallenge()">
                🎲 تحدي عشوائي
            </button>

        </section>

    </main>


    <!-- FEEDBACK -->

    <div class="feedback" id="feedback">

        <div class="feedback-card">

            <div class="feedback-emoji" id="feedbackEmoji">
                🎉
            </div>

            <h2 id="feedbackTitle">
                أحسنت!
            </h2>

            <p id="feedbackText">
                إجابة ممتازة!
            </p>

            <button class="next-btn" onclick="closeFeedback()">
                التالي 🚀
            </button>

        </div>

    </div>

        /* =====================================================
           AUDIO — أصوات التصفيق والخبط فقط
        ===================================================== */

        let audioContext;

        function getAudio() {

            if (!audioContext) {
                audioContext =
                    new (window.AudioContext ||
                        window.webkitAudioContext)();
            }

            return audioContext;
        }

        function tone(
            frequency,
            duration = .12,
            type = "sine",
            volume = .08
        ) {

            if (!soundEnabled) return;

            const ctx = getAudio();

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            osc.type = type;
            osc.frequency.value = frequency;

            gain.gain.setValueAtTime(
                volume,
                ctx.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                ctx.currentTime + duration
            );

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + duration);
        }

        function playSuccess() {

            if (!soundEnabled) return;

            // صوت تصفيق حقيقي مُركّب باستخدام Web Audio API
            const ctx = getAudio();
            const now = ctx.currentTime;

            // التصفيق أصبح أطول وأوضح حتى يلحق الطفل يسمعه كاملًا
            for (let i = 0; i < 12; i++) {
                const start = now + i * 0.095;
                const bufferSize = Math.floor(ctx.sampleRate * 0.085);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let j = 0; j < bufferSize; j++) {
                    const envelope = 1 - j / bufferSize;
                    data[j] = (Math.random() * 2 - 1) * envelope;
                }

                const source = ctx.createBufferSource();
                const gain = ctx.createGain();

                source.buffer = buffer;
                gain.gain.setValueAtTime(0.16, start);
                gain.gain.exponentialRampToValueAtTime(0.001, start + 0.085);

                source.connect(gain);
                gain.connect(ctx.destination);
                source.start(start);
            }
        }

            const now = ctx.currentTime;

            const osc = ctx.createOscillator();

            osc.type = "triangle";
            osc.frequency.setValueAtTime(125, now);

        /* =====================================================
           SHUFFLE
        ===================================================== */

        function shuffle(array) {

            const arr = [...array];

            for (
                let i = arr.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(Math.random() * (i + 1));

                [
                    arr[i],
                    arr[j]
                ] =
                    [
                        arr[j],
                        arr[i]
                    ];
            }

            return arr;
        }

        ===================================================== */

        function getUniqueQuestion(
            bank,
            type
        ) {

            if (
                usedQuestions[type].size
                >= bank.length
            ) {

                usedQuestions[type].clear();

            }

            let index;

            do {

                index =
                    Math.floor(
                        Math.random() * bank.length
                    );

            } while (
                usedQuestions[type].has(index)
            );

            usedQuestions[type].add(index);

            return bank[index];
        }

        function answerMCQ(

            const buttons =
                document.querySelectorAll(
                    ".answer"
                );

            buttons.forEach(
                b => b.disabled = true
            );

            totalAnswered++;

            if (isCorrect) {

                button.classList.add("correct");

                correctAnswers++;

                combo++;

                let earned = 1;

                if (combo >= 3) {
                    earned = 2;
                }

                if (combo >= 5) {
                    earned = 3;
                    playCombo();
                } else {
                    playSuccess();
                }

                addStars(earned);

                characterCorrect();

                showFeedback(
                    true,
                    combo >= 5
                        ? "🔥 كومبو رهيب!"
                        : "🎉 أحسنت!"
                );

            } else {

                button.classList.add("wrong");

                // تم التعديل: تقليل الكومبو بدل التصفير لعدم إحباط الطفل
                combo = Math.max(0, combo - 1);

                playWrong();

                characterWrong();

                buttons.forEach(
                    b => {
                        if (
                            b.textContent.trim()
                            === currentQuestion.a[
                            currentQuestion.correct
                            ]
                        ) {
                            b.classList.add(

                            );

                    }
                );

                    false,

                );

            updateStats();
        }

            card.textContent =
                card.dataset.symbol;

            }

            const second = card;

                second.dataset.symbol

        function addStars(amount) {

                "stars",
                stars
            );

            checkLevel();

            updateStats();
        }

        function checkLevel() {

            const newLevel =
                Math.floor(stars / 20) + 1;

            if (newLevel > level) {

                level = newLevel;

                localStorage.setItem(
                    "level",
                    level
                );

                playCombo();

                createConfetti();

                setTimeout(
                    () => {
                        showFeedback(
                            true,
                            `وصلت للمستوى ${level}! 🏆`
                        );
                    },
                    300
                );
            }
        }


        /* =====================================================
           UPDATE STATS
        ===================================================== */

        function updateStats() {

            document.getElementById(
                "stars"
            ).textContent = stars;

            document.getElementById(
                "combo"
            ).textContent = combo;

            document.getElementById(
                "level"
            ).textContent = level;

            let progress =
                Math.min(
                    100,
                    (stars % 20) / 20 * 100
                );

            document.getElementById(
                "progressBar"
            ).style.width =
                progress + "%";

            document.getElementById(
                "progressText"
            ).textContent =
                Math.round(progress) + "%";

            // نظام الشارات (Badges) الجديد المضاف
            let badgesHTML = "";
            if (level >= 2) badgesHTML += "🥉 ";
            if (level >= 5) badgesHTML += "🥈 ";
            if (level >= 10) badgesHTML += "🥇 ";
            if (level >= 15) badgesHTML += "🏆 ";
            if (level >= 20) badgesHTML += "👑 ";

            document.getElementById("badgesList").innerHTML = badgesHTML;
        }

            const confirmed = confirm(

            if (!confirmed) return;

            stars = 0;
            combo = 0;
            level = 1;
            totalAnswered = 0;
            correctAnswers = 0;

            localStorage.removeItem("stars");
            localStorage.removeItem("level");

            updateStats();

            // رسالة بسيطة للطفل بعد إعادة البداية
            const characterMessage = document.getElementById("characterMessage");
            if (characterMessage) {
                characterMessage.textContent = "بدأنا من جديد! هيا يا بطل! 🚀";
            }
        }

            document.getElementById(
                "feedbackEmoji"
            ).textContent =
                success
                    ? ["🎉", "🥳", "⭐", "🏆", "🚀"]
                    [Math.floor(Math.random() * 5)]
                    : ["💪", "🧠", "🙂", "🔎"]
                    [Math.floor(Math.random() * 4)];

            document.getElementById(
                "feedbackTitle"
            ).textContent =
                success
                    ? "أحسنت يا بطل!"
                    : "قربت جدًا!";

            document.getElementById(
                "feedbackText"
            ).textContent =
                message;

            modal.classList.add("show");
        }

        function closeFeedback() {

            document.getElementById(
                "feedback"
            ).classList.remove("show");

            if (currentGame) {
                renderGame(currentGame);
            }
        }


        /* =====================================================
           CONFETTI
        ===================================================== */

        function createConfetti() {

            const emojis =
                ["⭐", "✨", "🎉", "🌟", "💫"];

            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className = "confetti";

                item.textContent =
                    emojis[
                    Math.floor(
                        Math.random() * emojis.length
                    )
                    ];

                item.style.left =
                    Math.random() * 100 + "vw";

                item.style.animationDelay =
                    Math.random() * .5 + "s";

                document.body.appendChild(item);

                setTimeout(
                    () => item.remove(),
                    2000
                );
            }
        }


        /* =====================================================
           RANDOM CHALLENGE
        ===================================================== */

        function startRandomChallenge() {

            const types = [

                "islamic",
                "arabic",
                "missing",
                "memory",
                "different",
                "reaction",
                "word",
                "scenario",
                "number",
                "pattern",
                "listen"

            ];

            const type =
                types[
                Math.floor(
                    Math.random() * types.length
                )
                ];

            startGame(type);
        }


        /* =====================================================
           CLOSE
        ===================================================== */

        function closeGame() {

            document.getElementById(
                "game"
            ).classList.remove("active");

            currentGame = null;
        }


        /* =====================================================
           INITIALIZE
        ===================================================== */

        randomCharacter();

        updateStats();

    </script>

</body>

</html>
